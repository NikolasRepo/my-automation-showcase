# nginx/nginx.conf
server {
  listen 80;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_method $request_method;
    proxy_pass_request_headers on;
  }

  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
  }
}